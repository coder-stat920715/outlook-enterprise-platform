# NGINX = edge: TLS termination, static SPA, CDN-style attachment cache, storage ingress, and L7 proxy to Envoy.
worker_processes auto;
events { worker_connections 16384; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on; tcp_nopush on; keepalive_timeout 65;
  server_tokens off;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  # CDN cache for signed attachment downloads (cache key excludes the signature: one object = one cache entry)
  proxy_cache_path /var/cache/nginx/cdn levels=1:2 keys_zone=cdn:50m max_size=2g inactive=7d use_temp_path=off;

  limit_conn_zone $binary_remote_addr zone=perip:20m;

  upstream envoy {
    least_conn;
    server envoy:8081 max_fails=3 fail_timeout=10s;        # passive checks (NGINX OSS)
    # server envoy2:8081 slow_start=60s;                   # slow_start is NGINX Plus only; slow start is implemented in Envoy
    keepalive 128;
  }

  upstream minio_origin { server minio:9000; keepalive 32; }

  # ---------------------------------------------------------------- edge (TLS terminates here in production)
  server {
    listen 8080;
    # listen 443 ssl http2;  ssl_protocols TLSv1.3 TLSv1.2;  ssl_certificate ...;  ssl_certificate_key ...;
    limit_conn perip 200;

    # Static SPA: hashed assets are immutable-cached for a year, index.html is never cached.
    location = /app/index.html { root /usr/share/nginx/html; add_header Cache-Control "no-cache"; }
    location /app/ {
      root /usr/share/nginx/html;
      add_header Cache-Control "public, max-age=31536000, immutable";
      etag on; gzip on; gzip_types text/css application/javascript application/json;
      try_files $uri /app/index.html;
    }

    # Signed attachment CDN:  /cdn/attachments/{tenant}/{mailbox}/{attachmentId}?md5=..&expires=..
    location /cdn/attachments/ {
      secure_link $arg_md5,$arg_expires;
      secure_link_md5 "$secure_link_expires$uri change-me-cdn-secret";
      if ($secure_link = "") { return 403; }
      if ($secure_link = "0") { return 410; }

      rewrite ^/cdn/attachments/(.*)$ /outlook-attachments/$1 break;
      proxy_pass http://minio_origin;
      proxy_set_header Host minio:9000;
      proxy_cache cdn;
      proxy_cache_key "$uri";
      proxy_cache_valid 200 206 7d;
      proxy_cache_lock on;                                 # request coalescing: one origin fetch per object
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      add_header X-Cache-Status $upstream_cache_status;
      add_header Cache-Control "private, max-age=600";
    }

    # Server-Sent Events / WebSocket: no buffering, long timeouts.
    location ~ ^/(v1/notifications|ws/) {
      proxy_pass http://envoy;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off; proxy_cache off;
      proxy_read_timeout 1h; proxy_send_timeout 1h;
    }

    # API
    location /v1/ {
      proxy_pass http://envoy;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 2s; proxy_read_timeout 30s;
      # bounded failover: one extra attempt at most (no retry storms)
      proxy_next_upstream error http_502 http_503;
      proxy_next_upstream_tries 2; proxy_next_upstream_timeout 3s;
    }

    location /gateway-admin/ { allow 127.0.0.1; allow 172.16.0.0/12; deny all; proxy_pass http://envoy; }
    location = /lb-health { access_log off; return 200 "ok\n"; }
  }

  # ---------------------------------------------------------------- storage ingress (presigned PUT uploads only)
  server {
    listen 9000;
    client_max_body_size 160m;
    location / {
      limit_except PUT { deny all; }                       # anonymous GET must never be possible here; downloads use /cdn/attachments
      proxy_pass http://minio_origin;
      proxy_set_header Host $http_host;                    # presigned URL signature covers the Host header
      proxy_request_buffering off;
    }
  }
}
