global: { scrape_interval: 10s }
scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['gateway-1:8080', 'gateway-2:8080'] }]
  - job_name: mail-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['mail-1:8081', 'mail-2:8081'] }]
  - job_name: calendar-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['calendar:8082'] }]
  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['notification:8083'] }]
