# Full local stack.  Build jars first:  mvn -q clean package -DskipTests   then:  docker compose up --build
# Edge:  http://localhost:8080   (NGINX -> Envoy -> gateways -> services)       Storage ingress (presigned PUT): :9000
name: outlook

x-java-service: &java-service
  restart: unless-stopped
  environment: &java-env
    REDIS_URL: redis://redis:6379
    REDIS_ADDRESS: redis://redis:6379
    KAFKA_BOOTSTRAP: kafka:9092
    PG_HOSTS: pg-shard-a,pg-shard-b
    PG_USER: outlook
    PG_PASSWORD: outlook

services:
  pg-shard-a:
    image: postgres:16
    environment: { POSTGRES_USER: outlook, POSTGRES_PASSWORD: outlook, POSTGRES_DB: postgres }
    volumes: [ "./infrastructure/postgres/init-shards-a.sh:/docker-entrypoint-initdb.d/init.sh:ro", "pg-a:/var/lib/postgresql/data" ]
    command: [ "postgres", "-c", "max_connections=400", "-c", "shared_buffers=256MB" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U outlook"], interval: 5s, timeout: 3s, retries: 20 }

  pg-shard-b:
    image: postgres:16
    environment: { POSTGRES_USER: outlook, POSTGRES_PASSWORD: outlook, POSTGRES_DB: postgres }
    volumes: [ "./infrastructure/postgres/init-shards-b.sh:/docker-entrypoint-initdb.d/init.sh:ro", "pg-b:/var/lib/postgresql/data" ]
    command: [ "postgres", "-c", "max_connections=400", "-c", "shared_buffers=256MB" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U outlook"], interval: 5s, timeout: 3s, retries: 20 }

  redis:
    image: redis:7.4-alpine
    command: [ "redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru" ]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck: { test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"], interval: 10s, timeout: 10s, retries: 20 }

  minio:
    image: minio/minio:latest
    command: server /data
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    volumes: [ "minio:/data" ]

  minio-init:
    image: minio/mc:latest
    depends_on: [ minio ]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/outlook-attachments;
      mc anonymous set download local/outlook-attachments;
      echo bucket ready"
    # bucket is only reachable through NGINX: GET via the signed /cdn/attachments path, PUT via :9000 (PUT only)

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes: [ "os:/usr/share/opensearch/data" ]

  mock-idp:
    image: python:3.12-slim
    command: [ "python", "/chaos/simulate_nov2026_outage.py", "--idp-only", "--port", "9099" ]
    volumes: [ "./infrastructure/chaos-test:/chaos:ro" ]
    ports: [ "9099:9099" ]

  mail-1:
    <<: *java-service
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile, args: { MODULE: outlook-mail-service } }
    environment:
      <<: *java-env
      MIGRATE_ON_STARTUP: "true"
      OPENSEARCH_URL: http://opensearch:9200
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      CDN_BASE_URL: http://localhost:8080
    depends_on: { pg-shard-a: { condition: service_healthy }, pg-shard-b: { condition: service_healthy }, redis: { condition: service_healthy }, kafka: { condition: service_healthy } }

  mail-2:
    <<: *java-service
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile, args: { MODULE: outlook-mail-service } }
    environment:
      <<: *java-env
      MIGRATE_ON_STARTUP: "false"
      OPENSEARCH_URL: http://opensearch:9200
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      CDN_BASE_URL: http://localhost:8080
    depends_on: [ mail-1 ]

  calendar:
    <<: *java-service
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile, args: { MODULE: outlook-calendar-service } }
    depends_on: [ mail-1 ]

  notification:
    <<: *java-service
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile, args: { MODULE: outlook-notification-service } }
    depends_on: { redis: { condition: service_healthy }, kafka: { condition: service_healthy } }

  gateway-1: &gateway
    <<: *java-service
    build: { context: ., dockerfile: infrastructure/docker/Dockerfile, args: { MODULE: outlook-gateway } }
    environment:
      <<: *java-env
      AUTH_MODE: introspect
      IDP_INTROSPECTION_URL: http://mock-idp:9099/introspect
      GATEWAY_ADMIN_KEY: change-me
      MAIL_UPSTREAMS: http://mail-1:8081,http://mail-2:8081
      CALENDAR_UPSTREAMS: http://calendar:8082
      NOTIFICATION_UPSTREAMS: http://notification:8083
    depends_on: [ redis, mock-idp, mail-1 ]

  gateway-2:
    <<: *gateway

  envoy:
    image: envoyproxy/envoy:v1.31.0
    volumes: [ "./infrastructure/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro" ]
    depends_on: [ gateway-1, gateway-2 ]
    ports: [ "9901:9901" ]

  nginx:
    image: nginx:1.27
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/html:/usr/share/nginx/html:ro
    ports: [ "8080:8080", "9000:9000" ]
    depends_on: [ envoy, minio ]

  prometheus:
    image: prom/prometheus:v2.55.0
    volumes: [ "./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" ]
    ports: [ "9090:9090" ]

  grafana:
    image: grafana/grafana:11.3.0
    volumes: [ "./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro" ]
    environment: { GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Admin }
    ports: [ "3000:3000" ]

volumes: { pg-a: {}, pg-b: {}, minio: {}, os: {} }
